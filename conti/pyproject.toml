[project]
name = "conti"
version = "0.1.0"
description = "Queries and charts over Leggio transcriptions of account books: sums, dates, cross-references (reads Leggio's workspace, never writes it)."
requires-python = ">=3.10,<3.13"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pillow>=10", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
conti = "conti.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["conti"]

[tool.setuptools.package-data]
conti = ["static/*", "prompts/*"]
